name: AnimalRescue-dev

services:
  db:
    image: postgres:17
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    image: animalrescue-backend
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app:/code/app
    restart: unless-stopped
    depends_on:
      - db
  
  frontend:
    build:
      context: ./frontend
    image: animalrescue-frontend
    environment:
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
      - db
    restart: unless-stopped
